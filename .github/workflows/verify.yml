name: Studio verification
on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Fetch pinned test-only base (no model)
        run: docker pull postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
      - name: Build offline isolation probe
        run: docker build --network=none --pull=false -t loft-ai-isolation-fixture test/fixtures/ai-container
      - name: Required container and HTTP acceptance (no silent skip)
        shell: bash
        run: |
          export LOFT_TEST_AI_IMAGE="$(docker image inspect --format '{{.Id}}' loft-ai-isolation-fixture)"
          node scripts/test-ai-container.mjs
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
        env:
          POSTGRES_DB: loft_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loft_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LOFT_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/loft_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:postgres
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-11-06
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - name: Install locked packages without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Local Python helper regressions
        run: npm run test:dev-assist
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: V2 contracts and mandatory review regressions
        run: npm run test:v2
      - name: Packed SDK consumer and standalone booking lifecycle
        run: npm run test:packages
      - run: npm run licenses
      - run: npm run sbom
      - name: Check known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Keep dependency evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dependency-evidence-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            test-results/sbom.cdx.json
            docs/v2/dependencies.json
            THIRD_PARTY_NOTICES.md
