name: Studio verification
on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-11-06
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - name: Install locked packages without lifecycle scripts
        run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run test:v2
      - run: npm run licenses
      - run: npm run sbom
      - name: Check known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Keep dependency evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dependency-evidence-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            test-results/sbom.cdx.json
            docs/v2/dependencies.json
            THIRD_PARTY_NOTICES.md
